
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아침 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFF2;
    --card:#F7F8FA;
    --ink:#1B2A41;
    --ink-soft:#5A6577;
    --ink-faint:#9AA3B1;
    --rule:#D8DCE3;
    --dawn:#E8A33D;
    --sea:#2E7D74;
    --plum:#7B5A8F;
    --sky:#3A6EA5;
    --rise:#C2412D;
    --globe:#4A6741;
    --lab:#3E6B8C;
    --life:#B0704A;
    --fall:#2B5FA8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans KR",-apple-system,"Segoe UI",sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px 80px;}

  /* ---- sunrise line: doubles as the loading indicator ---- */
  .horizon{position:sticky;top:0;z-index:40;height:3px;background:var(--rule);}
  .horizon span{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--ink) 0%,var(--plum) 35%,var(--dawn) 100%);
    transition:width .6s ease;
  }
  .horizon.on span{width:100%;transition:width 14s cubic-bezier(.1,.7,.2,1);}
  .horizon.done span{width:100%;transition:width .3s ease;opacity:.35;}

  /* ---- masthead ---- */
  header{padding:38px 0 24px;}
  .eyebrow{
    font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:500;margin:0 0 12px;
  }
  h1{
    font-family:"Gowun Batang",Georgia,serif;font-weight:700;
    font-size:clamp(30px,6vw,46px);line-height:1.18;margin:0 0 10px;
    letter-spacing:-.01em;
  }
  .standfirst{margin:0;font-size:14.5px;color:var(--ink-soft);max-width:46ch;line-height:1.65;}

  /* ---- controls ---- */
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:26px 0 8px;}
  .chip{
    font-family:inherit;font-size:12.5px;font-weight:400;
    padding:7px 13px;border-radius:999px;cursor:pointer;
    border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{border-color:var(--ink-faint);}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F7F8FA;font-weight:500;}
  .chip:focus-visible,.load:focus-visible,.item:focus-visible,.back:focus-visible{
    outline:2px solid var(--dawn);outline-offset:2px;
  }
  .load{
    font-family:inherit;font-size:12.5px;font-weight:500;letter-spacing:.02em;
    padding:8px 16px;border-radius:999px;cursor:pointer;margin-left:auto;
    border:1px solid var(--dawn);background:var(--dawn);color:#231A08;
    transition:opacity .15s;
  }
  .load:hover{opacity:.86;}
  .load[disabled]{opacity:.45;cursor:default;}
  .stamp{font-size:11.5px;color:var(--ink-faint);margin:2px 0 0;letter-spacing:.02em;}

  /* ---- market strip ---- */
  .market{
    display:flex;flex-wrap:wrap;gap:0;margin-top:22px;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);
  }
  .tick{flex:1 1 132px;padding:13px 16px 13px 0;min-width:0;}
  .tick .nm{font-size:10.5px;letter-spacing:.12em;color:var(--ink-faint);font-weight:500;margin-bottom:5px;}
  .tick .px{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:19px;line-height:1.1;}
  .tick .ch{font-size:12px;margin-top:4px;font-weight:400;}
  .tick.up .ch{color:var(--rise);}
  .tick.down .ch{color:var(--fall);}
  .tick.flat .ch{color:var(--ink-faint);}
  .market.pending .tick .px{color:var(--ink-faint);}

  /* ---- term lookup ---- */
  .lookup{display:flex;gap:8px;margin-top:20px;}
  .lookup input{
    flex:1;min-width:0;font-family:inherit;font-size:14px;font-weight:300;color:var(--ink);
    background:var(--card);border:1px solid var(--rule);border-bottom-color:var(--ink-faint);
    padding:11px 14px;border-radius:0;
  }
  .lookup input::placeholder{color:var(--ink-faint);}
  .lookup input:focus{outline:none;border-color:var(--ink);}
  .lookup button{
    font-family:inherit;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;
    padding:11px 17px;border:1px solid var(--ink);background:var(--ink);color:var(--card);
  }
  .lookup button[disabled]{opacity:.45;cursor:default;}
  .gloss{
    border-left:2px solid var(--sea);padding:14px 0 14px 16px;margin-top:16px;
    animation:rise .4s ease both;
  }
  .gloss .term{font-size:10.5px;letter-spacing:.14em;font-weight:600;color:var(--sea);margin-bottom:8px;}
  .gloss p{margin:0 0 9px;font-size:14px;line-height:1.78;color:var(--ink);}
  .gloss p:last-child{margin-bottom:0;}
  .gloss .note{font-size:13px;color:var(--ink-soft);}

  /* ---- two-pane ---- */
  .panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:38px;margin-top:26px;align-items:start;}

  /* ---- issue list ---- */
  .list{list-style:none;margin:0;padding:0;}
  .item{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:0;border-top:1px solid var(--rule);
    padding:18px 4px 18px 20px;position:relative;font-family:inherit;
    transition:background .15s;
  }
  .list li:last-child .item{border-bottom:1px solid var(--rule);}
  .item:hover{background:var(--card);}
  .item[aria-current="true"]{background:var(--card);}
  .item::before{
    content:"";position:absolute;left:2px;top:24px;
    width:7px;height:7px;border-radius:50%;background:var(--dot,var(--ink-faint));
  }
  .item[aria-current="true"]::after{
    content:"";position:absolute;left:5.5px;top:31px;bottom:18px;width:1px;background:var(--dot,var(--ink-faint));opacity:.4;
  }
  .kicker{font-size:10.5px;letter-spacing:.14em;font-weight:500;color:var(--dot,var(--ink-faint));margin-bottom:6px;}
  .item h2{
    font-family:"Gowun Batang",Georgia,serif;font-weight:700;
    font-size:17.5px;line-height:1.45;margin:0 0 6px;color:var(--ink);
  }
  .item p{margin:0;font-size:13.5px;line-height:1.62;color:var(--ink-soft);}

  /* ---- reader ---- */
  .reader{position:sticky;top:36px;background:var(--card);border:1px solid var(--rule);padding:28px 26px 30px;}
  .reader h3{
    font-family:"Gowun Batang",Georgia,serif;font-weight:700;
    font-size:22px;line-height:1.36;margin:8px 0 14px;
  }
  .sec{margin:0 0 20px;}
  .sec:last-child{margin-bottom:0;}
  .sec h4{
    font-size:10.5px;letter-spacing:.14em;font-weight:600;color:var(--ink-faint);
    margin:0 0 8px;text-transform:uppercase;
  }
  .sec p{margin:0;font-size:14px;line-height:1.78;color:var(--ink);}
  .sec ul{margin:0;padding-left:0;list-style:none;}
  .sec ul li{
    font-size:14px;line-height:1.75;color:var(--ink);margin-bottom:9px;padding-left:15px;position:relative;
  }
  .sec ul li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:1px;background:var(--ink-faint);}
  .history{border-left:2px solid var(--plum);padding-left:14px;}
  .history p{font-size:13.5px;color:var(--ink);}
  .korea{border-left:2px solid var(--sea);padding-left:14px;}
  .kr-era{
    font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:15.5px;
    color:var(--sea);margin-bottom:6px;
  }
  .korea p{margin:0 0 7px;font-size:13.5px;line-height:1.72;color:var(--ink);}
  .korea p:last-child{margin-bottom:0;}
  .kr-line span{
    display:inline-block;font-size:10.5px;letter-spacing:.1em;font-weight:600;
    color:var(--ink-faint);margin-right:7px;
  }
  .term-row{margin-bottom:14px;}
  .term-row:last-child{margin-bottom:0;}
  .term-name{
    font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:15px;
    color:var(--ink);margin-bottom:4px;
  }
  .term-row p{margin:0;font-size:13.5px;line-height:1.72;color:var(--ink);}
  .term-here{margin-top:4px!important;color:var(--ink-soft)!important;font-size:13px!important;}
  .qa{margin-bottom:14px;}
  .qa:last-child{margin-bottom:0;}
  .qa-q{
    font-size:13.5px;font-weight:500;color:var(--sea);margin-bottom:5px;line-height:1.6;
    padding-left:15px;position:relative;
  }
  .qa-q::before{content:"?";position:absolute;left:0;top:0;font-weight:600;}
  .qa p{margin:0;font-size:13.5px;line-height:1.72;color:var(--ink);padding-left:15px;}
  .subjects{border-left:2px solid var(--dawn);padding-left:14px;}
  .subj{margin-bottom:13px;}
  .subj:last-child{margin-bottom:0;}
  .subj-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px;}
  .subj-name{
    font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--dawn);
    border:1px solid var(--dawn);padding:2px 7px;border-radius:999px;flex:none;
  }
  .subj-unit{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:14.5px;color:var(--ink);}
  .subj p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-soft);}
  .sources a{
    display:block;font-size:12.5px;color:var(--sky);text-decoration:none;
    border-bottom:1px solid var(--rule);padding:8px 0;line-height:1.5;
  }
  .sources a:hover{color:var(--ink);}
  .back{display:none;}

  /* ---- states ---- */
  .empty,.oops{padding:34px 0;font-size:14px;line-height:1.7;color:var(--ink-soft);}
  .oops{color:var(--ink);}
  .oops button{
    display:block;margin-top:12px;font-family:inherit;font-size:12.5px;padding:7px 15px;
    border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer;
  }
  .skel{border-top:1px solid var(--rule);padding:18px 4px 18px 20px;}
  .skel div{height:10px;background:var(--rule);margin-bottom:9px;animation:pulse 1.4s ease-in-out infinite;}
  .skel div:nth-child(1){width:22%;height:8px;}
  .skel div:nth-child(2){width:78%;height:13px;}
  .skel div:nth-child(3){width:56%;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}

  .reveal{opacity:0;transform:translateY(7px);animation:rise .5s ease forwards;}
  @keyframes rise{to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .reveal{opacity:1;transform:none;}
    .horizon.on span,.horizon.done span{width:100%;}
  }

  /* ---- mobile: reader becomes a full sheet ---- */
  @media (max-width:820px){
    .panes{grid-template-columns:1fr;gap:0;}
    .reader{
      position:fixed;inset:0;z-index:60;overflow-y:auto;border:0;
      padding:20px 22px 60px;display:none;
    }
    body.reading .reader{display:block;}
    body.reading{overflow:hidden;}
    .back{
      display:inline-block;font-family:inherit;font-size:12.5px;color:var(--ink-soft);
      background:transparent;border:0;padding:6px 0 14px;cursor:pointer;letter-spacing:.02em;
    }
    .reader.idle{display:none!important;}
    .load{margin-left:0;}
  }
</style>
</head>
<body>

<div class="horizon" id="horizon"><span></span></div>

<div class="wrap">
  <header>
    <p class="eyebrow" id="dateline">불러오는 중</p>
    <h1>오늘 아침에<br>알아둘 것들</h1>
    <p class="standfirst">헤드라인을 누르면 그 뉴스를 처음부터 풀어드려요. 모르는 낱말은 아래 칸에 넣어보세요.</p>
  </header>

  <div class="controls" id="filters">
    <button class="chip" data-cat="전체" aria-pressed="true">전체</button>
    <button class="chip" data-cat="정치" aria-pressed="false">정치</button>
    <button class="chip" data-cat="경제" aria-pressed="false">경제</button>
    <button class="chip" data-cat="증시·주식" aria-pressed="false">증시·주식</button>
    <button class="chip" data-cat="사회" aria-pressed="false">사회</button>
    <button class="chip" data-cat="IT·테크" aria-pressed="false">IT·테크</button>
    <button class="chip" data-cat="교육·AI" aria-pressed="false">교육·AI</button>
    <button class="chip" data-cat="세계" aria-pressed="false">세계</button>
    <button class="chip" data-cat="과학" aria-pressed="false">과학</button>
    <button class="chip" data-cat="생활·상식" aria-pressed="false">생활·상식</button>
    <button class="load" id="load">브리핑 받기</button>
  </div>
  <p class="stamp" id="stamp"></p>

  <div class="market pending" id="market"></div>

  <div class="lookup">
    <input id="termInput" type="text" autocomplete="off"
           placeholder="모르는 낱말이 나오면 여기에 넣어보세요 (예: 국정조사, 관세)">
    <button id="termGo">뜻 찾기</button>
  </div>
  <div id="termOut"></div>

  <div class="panes">
    <div id="listPane"></div>
    <aside class="reader idle" id="reader">
      <button class="back" id="back">← 목록</button>
      <div id="readerBody"></div>
    </aside>
  </div>
</div>

<script>
const CATS = {
  "정치":   "var(--ink)",
  "경제":   "var(--sea)",
  "증시·주식":"var(--rise)",
  "사회":   "var(--plum)",
  "IT·테크":"var(--sky)",
  "교육·AI":"var(--dawn)",
  "세계":    "var(--globe)",
  "과학":    "var(--lab)",
  "생활·상식":"var(--life)"
};

const el = id => document.getElementById(id);
const listPane = el("listPane"), reader = el("reader"), readerBody = el("readerBody");
const horizon = el("horizon"), loadBtn = el("load"), stamp = el("stamp");

let issues = [], filter = "전체", activeId = null;
const detailCache = new Map();

/* ---------- date ---------- */
const now = new Date();
const DAYS = ["일","월","화","수","목","금","토"];
const todayLabel = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${DAYS[now.getDay()]}요일`;
el("dateline").textContent = todayLabel;

/* ---------- api ---------- */
const PASSCODE = new URLSearchParams(location.search).get("k") || "";

async function ask(prompt, kind){
  const res = await fetch("/api/claude",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-app-key":PASSCODE},
    body:JSON.stringify({prompt, kind: kind || "list"})
  });
  const data = await res.json().catch(()=>({error:{message:"서버 응답을 읽지 못했습니다."}}));
  if(!res.ok || data.error){
    throw new Error((data.error && data.error.message) || `요청 실패 (${res.status})`);
  }
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

function parseJSON(text){
  let t = String(text||"").replace(/```json/gi,"").replace(/```/g,"").trim();
  const s = t.search(/[\[{]/);
  if(s === -1) throw new Error("형식을 읽지 못했습니다.");
  const open = t[s], close = open === "[" ? "]" : "}";
  const e = t.lastIndexOf(close);
  if(e > s){
    try{ return JSON.parse(t.slice(s, e+1)); }catch(_){}
  }
  // 잘린 배열이면 완결된 항목까지만 살려냅니다.
  if(open === "["){
    const cut = t.lastIndexOf("}");
    if(cut > s){
      try{ return JSON.parse(t.slice(s, cut+1) + "]"); }catch(_){}
    }
  }
  throw new Error("응답이 중간에 끊겼습니다. 다시 시도해 주세요.");
}

const NEUTRAL = "정치 사안은 사실과 각 입장을 균형 있게 전달하고, 특정 정당이나 진영을 옹호·비판하지 마세요.";

/* ---------- market snapshot ---------- */
const market = el("market");

function marketSkeleton(){
  market.className = "market pending";
  market.innerHTML = ["코스피","코스닥","원/달러","나스닥","비트코인"].map(n=>
    `<div class="tick flat"><div class="nm">${n}</div><div class="px">—</div><div class="ch">확인 중</div></div>`).join("");
}

async function loadMarket(){
  marketSkeleton();
  try{
    const raw = await ask(
`오늘은 ${todayLabel}입니다. 웹 검색으로 가장 최근 시세를 확인해 아래 5개를 채우세요.
코스피 지수, 코스닥 지수, 원/달러 환율, 나스닥 종합지수, 비트코인(원화 또는 달러).
검색으로 확인되지 않은 값은 지어내지 말고 price를 "-"로 두세요.

아래 JSON 배열만 출력하세요. 설명, 코드펜스 없이 배열만.
[{"name":"코스피","price":"3,120.45","change":"+18.2 (0.59%)","dir":"up|down|flat"}]`, "market"
    );
    const rows = parseJSON(raw).slice(0,5);
    market.className = "market";
    market.innerHTML = rows.map(r=>`
      <div class="tick ${["up","down","flat"].includes(r.dir)?r.dir:"flat"}">
        <div class="nm">${escapeHtml(r.name||"")}</div>
        <div class="px">${escapeHtml(r.price||"—")}</div>
        <div class="ch">${escapeHtml(r.change||"")}</div>
      </div>`).join("");
  }catch(err){
    market.className = "market";
    market.innerHTML = `<div class="tick flat" style="flex-basis:100%"><div class="nm">시세</div>
      <div class="ch">시세를 불러오지 못했습니다. 브리핑을 새로 받으면 다시 시도합니다.</div></div>`;
  }
}

/* ---------- load briefing ---------- */
async function loadBriefing(){
  loadBtn.disabled = true;
  loadBtn.textContent = "찾는 중";
  horizon.className = "horizon on";
  activeId = null;
  reader.classList.add("idle");
  document.body.classList.remove("reading");
  readerBody.innerHTML = "";
  listPane.innerHTML = Array.from({length:5},()=>
    `<div class="skel"><div></div><div></div><div></div></div>`).join("");
  loadMarket();

  try{
    const raw = await ask(
`오늘은 ${todayLabel}입니다. 웹 검색으로 오늘의 주요 뉴스를 찾아 12개 이슈를 고르세요.
정치·경제·증시/주식·사회·IT/테크·교육(특히 AI 교육)·세계·과학·생활/상식 분야가 고루 들어가게 하되,
증시·주식 최소 2개, 교육 최소 1개, 세계 최소 2개, 과학 최소 1개, 생활·상식 최소 1개를 포함하세요.
생활·상식은 사건 뉴스가 아니어도 됩니다. 오늘 알아두면 쓸모 있는 제도 변경, 건강, 날씨, 물가, 생활 규칙 같은 것을 고르세요.

읽는 사람은 중·고등학생입니다. 학생이 이해할 수 있고 알아두면 도움이 되는 이슈를 고르세요.
자극적인 사건·사고나 선정적인 내용은 넣지 마세요. 제목과 요약도 쉬운 말로 쓰세요.
${NEUTRAL} 특정 종목의 매수·매도를 권하지 말고, 시장에서 일어난 사실만 전하세요.

아래 JSON 배열만 출력하세요. 설명, 머리말, 코드펜스 없이 배열만.

    return;

  listPane.innerHTML = `<ul class="list">` + shown.map((i,n)=>`

      <button class="item" data-id="${i.id}" style="--dot:${CATS[i.category]||"var(--ink-faint)"}"

  listPane.querySelectorAll(".item").forEach(b=>{

}

/* 구분선 형식을 읽습니다. 중간에 잘려도 읽어낸 만큼은 살아남습니다. */
function parseSections(text){
  const map = {};
  let key = null, buf = [];
  const flush = ()=>{ if(key) map[key] = buf.join("\n").trim(); buf = []; };
  String(text||"").split(/\r?\n/).forEach(line=>{
    const m = line.match(/^\s*#{1,3}\s*(배경|핵심|영향|역사|한국사|개념|문답|교과|출처)\s*$/);
    if(m){ flush(); key = m[1]; } else if(key){ buf.push(line); }
  });
  flush();

  const bullets = (s)=> String(s||"").split(/\r?\n/)
    .map(l=>l.replace(/^\s*[-*•]\s*/,"").trim()).filter(Boolean);

  return {
    background: map["배경"] || "",
    points: bullets(map["핵심"]),
    impact: map["영향"] || "",
    history: /^없음\.?$/.test((map["역사"]||"").trim()) ? "" : (map["역사"] || ""),
    korea: (function(){
      const raw = (map["한국사"]||"").trim();
      if(!raw || /^없음\.?$/.test(raw)) return null;
      const line = bullets(raw).find(l=>l.includes("|"));
      if(!line) return null;
      const p = line.split("|").map(x=>x.trim());
      return p[0] ? { era:p[0], what:p[1]||"", same:p[2]||"", diff:p[3]||"" } : null;
    })(),
    terms: bullets(map["개념"]).map(l=>{
      const p = l.split("|").map(x=>x.trim());
      return p.length >= 2 ? { name: p[0], def: p[1] || "", here: p[2] || "" } : null;
    }).filter(Boolean),
    qa: bullets(map["문답"]).map(l=>{
      const i = l.indexOf("|");
      return i === -1 ? null : { q: l.slice(0,i).trim(), a: l.slice(i+1).trim() };
    }).filter(x=>x && x.q && x.a),
    subjects: bullets(map["교과"]).map(l=>{
      const p = l.split("|").map(x=>x.trim());
      return p.length >= 2 ? { name: p[0], unit: p[1] || "", act: p[2] || "" } : null;
    }).filter(Boolean),
    sources: bullets(map["출처"]).map(l=>{
      const i = l.lastIndexOf("|");
      if(i === -1){
        const u = l.match(/https?:\/\/\S+/);
        return u ? { title: l.replace(u[0],"").trim() || u[0], url: u[0] } : null;
      }
      return { title: l.slice(0,i).trim(), url: l.slice(i+1).trim() };
    }).filter(s=>s && /^https?:\/\//i.test(s.url))
  };
}

function paintDetail(issue, d){
  const pts = Array.isArray(d.points) ? d.points : [];
  const srcs = Array.isArray(d.sources) ? d.sources : [];
  const subs = Array.isArray(d.subjects) ? d.subjects : [];
  const trm  = Array.isArray(d.terms) ? d.terms : [];
  const qa   = Array.isArray(d.qa) ? d.qa : [];
  const kr   = d.korea && d.korea.era ? d.korea : null;
  readerBody.innerHTML = `
    <div class="kicker" style="--dot:${CATS[issue.category]||"var(--ink-faint)"}">${escapeHtml(issue.category||"")}</div>
    <h3>${escapeHtml(issue.title)}</h3>
    ${d.background ? `<div class="sec"><h4>배경</h4><p>${escapeHtml(d.background)}</p></div>`:""}
    ${pts.length ? `<div class="sec"><h4>핵심</h4><ul>${pts.map(p=>`<li>${escapeHtml(p)}</li>`).join("")}</ul></div>`:""}
    ${d.impact ? `<div class="sec"><h4>영향</h4><p>${escapeHtml(d.impact)}</p></div>`:""}
    ${trm.length ? `<div class="sec"><h4>알아야 할 개념</h4>${trm.map(t=>`
        <div class="term-row">
          <div class="term-name">${escapeHtml(t.name)}</div>
          <p>${escapeHtml(t.def)}</p>
          ${t.here ? `<p class="term-here">${escapeHtml(t.here)}</p>`:""}
        </div>`).join("")}</div>`:""}
    ${qa.length ? `<div class="sec"><h4>묻고 답하기</h4>${qa.map(x=>`
        <div class="qa">
          <div class="qa-q">${escapeHtml(x.q)}</div>
          <p>${escapeHtml(x.a)}</p>
        </div>`).join("")}</div>`:""}
    ${d.history ? `<div class="sec history"><h4>역사와 견주면</h4><p>${escapeHtml(d.history)}</p></div>`:""}
    ${kr ? `<div class="sec korea">
        <h4>우리 역사에서는</h4>
        <div class="kr-era">${escapeHtml(kr.era)}</div>
        ${kr.what ? `<p>${escapeHtml(kr.what)}</p>`:""}
        ${kr.same ? `<p class="kr-line"><span>닮은 점</span>${escapeHtml(kr.same)}</p>`:""}
        ${kr.diff ? `<p class="kr-line"><span>다른 점</span>${escapeHtml(kr.diff)}</p>`:""}
      </div>`:""}
    ${subs.length ? `<div class="sec subjects"><h4>배운 것과 잇기</h4>${subs.map(x=>`
        <div class="subj">
          <div class="subj-top"><span class="subj-name">${escapeHtml(x.name)}</span><span class="subj-unit">${escapeHtml(x.unit)}</span></div>
          ${x.act ? `<p>${escapeHtml(x.act)}</p>`:""}
        </div>`).join("")}</div>`:""}
    ${srcs.length ? `<div class="sec sources"><h4>출처</h4>${srcs.map(s=>
        `<a href="${escapeAttr(s.url||"#")}" target="_blank" rel="noopener">${escapeHtml(s.title||s.url||"기사 열기")}</a>`).join("")}</div>`:""}
  `;
}

/* ---------- helpers ---------- */
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(u){
  const s = String(u??"");
  return /^https?:\/\//i.test(s) ? escapeHtml(s) : "#";
}

`"${term}"이 무슨 뜻인지 필요하면 웹 검색으로 확인한 뒤 설명하세요. ${ctx}

    const blocks = String(raw).split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).slice(0,4);
    termOut.innerHTML = `<div class="gloss"><div class="term">${escapeHtml(term)}</div>` +
      blocks.map((b,i)=>`<p class="${i===blocks.length-1&&blocks.length>1?"note":""}">${escapeHtml(b)}</p>`).join("") +

    termGo.disabled = false;
    termGo.textContent = "뜻 찾기";
  }
}
